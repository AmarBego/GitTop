name: AUR Distribution

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release Workflow Run ID"
        required: true

jobs:
  check:
    name: Check Release Status
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: release-meta
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}

      - name: Read release info
        id: release
        run: |
          TAG=$(cat release-meta/tag)
          IS_PRERELEASE=$(cat release-meta/is_prerelease)
          if [[ "$TAG" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi
          VERSION="${TAG#v}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Release: $TAG (v$VERSION), Prerelease: $IS_PRERELEASE"

      - name: Determine if should run
        id: check
        run: |
          if [ "${{ steps.release.outputs.is_prerelease }}" == "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping AUR update for prerelease: ${{ steps.release.outputs.tag }}"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # Job for stable releases (gittop-bin)
  aur-stable-bin:
    name: Update gittop-bin (AUR)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required to download artifacts from another workflow
      contents: read # Required to checkout the repo
    # Only run if Release workflow succeeded
    if: ${{ needs.check.outputs.should_build == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # Update pkgver and sha256sums in PKGBUILD
      - name: Update PKGBUILD version and checksum
        run: |
          VERSION="${{ needs.check.outputs.tag }}"
          VERSION="${VERSION#v}"

          PKGBUILD=./packaging/aur/stable-bin/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$PKGBUILD"

          # Per-arch tarball download + checksum
          for arch in x86_64 aarch64; do
            URL="https://github.com/AmarBego/GitTop/releases/download/v${VERSION}/gittop-${VERSION}-linux-gnu-${arch}.tar.gz"
            curl -L -o "/tmp/gittop-${arch}.tar.gz" "$URL"
            SUM=$(sha256sum "/tmp/gittop-${arch}.tar.gz" | cut -d' ' -f1)
            rm "/tmp/gittop-${arch}.tar.gz"
            sed -i "s/^sha256sums_${arch}=.*/sha256sums_${arch}=('${SUM}')/" "$PKGBUILD"
            echo "${arch}: ${SUM}"
          done

          echo "Updated PKGBUILD to version: $VERSION"
          grep -E "^(pkgver|sha256sums_)" "$PKGBUILD"

      # Publish to AUR (checksums already updated, no need for updpkgsums)
      - name: Publish gittop-bin
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: gittop-bin
          pkgbuild: ./packaging/aur/stable-bin/PKGBUILD
          assets: ./packaging/aur/stable-bin/gittop.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.check.outputs.tag }}
          ssh_keyscan_types: ed25519
          updpkgsums: false

      - uses: kesin11/actions-timeline@v2

  # Job for stable releases (gittop) — built from source
  aur-stable:
    name: Update gittop (AUR)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    if: ${{ needs.check.outputs.should_build == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Update PKGBUILD version and checksum
        run: |
          VERSION="${{ needs.check.outputs.tag }}"
          VERSION="${VERSION#v}"

          PKGBUILD=./packaging/aur/stable/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$PKGBUILD"

          URL="https://github.com/AmarBego/GitTop/archive/refs/tags/v${VERSION}.tar.gz"
          curl -L -o "/tmp/source.tar.gz" "$URL"
          SUM=$(sha256sum "/tmp/source.tar.gz" | cut -d' ' -f1)
          rm "/tmp/source.tar.gz"
          sed -i "s/^sha256sums=.*/sha256sums=('${SUM}')/" "$PKGBUILD"

          echo "Updated PKGBUILD to version: $VERSION"
          grep -E "^(pkgver|pkgrel|sha256sums)" "$PKGBUILD"

      - name: Publish gittop
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: gittop
          pkgbuild: ./packaging/aur/stable/PKGBUILD
          assets: ./packaging/aur/stable/gittop.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.check.outputs.tag }}
          ssh_keyscan_types: ed25519
          updpkgsums: false

      - uses: kesin11/actions-timeline@v2

