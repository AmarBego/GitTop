name: Scoop Distribution

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release Workflow Run ID"
        required: true

jobs:
  check:
    name: Check Release Status
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: release-meta
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}

      - name: Read release info
        id: release
        run: |
          TAG=$(cat release-meta/tag)
          IS_PRERELEASE=$(cat release-meta/is_prerelease)
          if [[ "$TAG" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi
          VERSION="${TAG#v}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Release: $TAG (v$VERSION), Prerelease: $IS_PRERELEASE"

      - name: Determine if should run
        id: check
        run: |
          if [ "${{ steps.release.outputs.is_prerelease }}" == "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping Scoop update for prerelease: ${{ steps.release.outputs.tag }}"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  scoop:
    name: Update Scoop Bucket
    needs: check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    if: ${{ needs.check.outputs.should_build == 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get checksums from release
        id: checksum
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          curl -L -o SHA256SUMS.txt "https://github.com/AmarBego/GitTop/releases/download/v${VERSION}/SHA256SUMS.txt"

          for arch in x86_64 aarch64; do
            SUM=$(grep "gittop-${VERSION}-windows-${arch}\.zip$" SHA256SUMS.txt | cut -d' ' -f1)
            if [ -z "$SUM" ]; then
              echo "::error::Could not find checksum for gittop-${VERSION}-windows-${arch}.zip in SHA256SUMS.txt"
              exit 1
            fi
            echo "checksum_${arch}=$SUM" >> $GITHUB_OUTPUT
            echo "${arch}: $SUM"
          done

      - name: Update Scoop manifest
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          HASH_X64="${{ steps.checksum.outputs.checksum_x86_64 }}"
          HASH_ARM64="${{ steps.checksum.outputs.checksum_aarch64 }}"

          jq --arg ver "$VERSION" --arg x64 "$HASH_X64" --arg arm64 "$HASH_ARM64" '
            .version = $ver |
            .architecture."64bit".url = "https://github.com/AmarBego/GitTop/releases/download/v\($ver)/gittop-\($ver)-windows-x86_64.zip" |
            .architecture."64bit".hash = $x64 |
            .architecture."64bit".extract_dir = "gittop-\($ver)-windows-x86_64" |
            .architecture."arm64".url = "https://github.com/AmarBego/GitTop/releases/download/v\($ver)/gittop-\($ver)-windows-aarch64.zip" |
            .architecture."arm64".hash = $arm64 |
            .architecture."arm64".extract_dir = "gittop-\($ver)-windows-aarch64"
          ' bucket/gittop.json > bucket/gittop.json.tmp && mv bucket/gittop.json.tmp bucket/gittop.json

          echo "Updated bucket/gittop.json:"
          cat bucket/gittop.json

      - name: Create PR for Scoop update
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          BRANCH="scoop-update-${{ needs.check.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add bucket/gittop.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "scoop: update to ${{ needs.check.outputs.tag }}"
          git push origin "$BRANCH" --force

          # Check if PR already exists
          PR_EXISTS=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --title "scoop: update to ${{ needs.check.outputs.tag }}" \
              --body "Automated Scoop manifest update for release ${{ needs.check.outputs.tag }}" \
              --base main \
              --head "$BRANCH"
          else
            echo "PR already exists: $PR_EXISTS"
          fi

      - uses: kesin11/actions-timeline@v2
